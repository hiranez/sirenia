name: release

# Publishes the container image for a version tag:
#   ghcr.io/<owner>/<repository>:<version>   (linux/amd64 and linux/arm64)
# Each architecture is built and tested on a runner of that architecture (no emulation), pushed
# under an architecture-specific tag, and the two are then joined under the version tag. A GitHub
# release is created with a CycloneDX SBOM of the image attached.
#
# There is no ":latest" tag on purpose: people should pin a version.
#
# Every action is pinned to a full commit SHA (release tag in the trailing comment), and only the
# actions already used by the other workflows are used here; everything else is the docker and gh
# command lines that the runners ship.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build, test and push (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Version and image name
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in package.json ($declared)"
            exit 1
          fi
          # Registry paths are lowercase.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker build \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$VERSION-$ARCH" .
      # The same image that is about to be published must start and render.
      - name: Smoke test
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
        run: |
          fail() { echo "::error::$1"; docker logs sirenia || true; exit 1; }
          docker run -d --name sirenia -p 8080:8080 "$IMAGE"
          for i in $(seq 1 240); do curl -sf http://localhost:8080/health >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8080/health >/dev/null || fail "port 8080 did not answer /health within 240 s"
          curl -sf -X POST http://localhost:8080/api/generate -H 'content-type: application/json' \
            -d '{"code":"graph TD; A-->B;","output":"png"}' -o out.png || fail "PNG request failed"
          [ "$(head -c 4 out.png | od -An -tx1 | tr -d ' ')" = "89504e47" ] || fail "PNG render returned non-PNG"
          found=$(docker run --rm --user 0 --entrypoint find "$IMAGE" / -xdev -name gcp.json -print)
          [ -z "$found" ] || fail "vendor pack files in the image: $found"
          [ "$(docker run --rm --entrypoint id "$IMAGE" -u)" != "0" ] || fail "the container runs as root"
          docker stop sirenia >/dev/null
      - name: Trivy scan (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker logout ghcr.io

  publish:
    name: Join architectures, SBOM, release
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Version and image name
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Join the two architectures under the version tag
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker pull "$IMAGE:$VERSION"
          docker logout ghcr.io
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          format: cyclonedx
          output: sirenia-${{ steps.meta.outputs.version }}.cdx.json
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "Container image: \`$IMAGE:$VERSION\` (linux/amd64, linux/arm64)"
            echo
            echo '```'
            echo "docker run --rm -p 8080:8080 -v sirenia-packs:/packs $IMAGE:$VERSION"
            echo '```'
            echo
            echo "Changes: see CHANGELOG.md. The attached file is a CycloneDX SBOM of the image."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md \
            "sirenia-$VERSION.cdx.json"
